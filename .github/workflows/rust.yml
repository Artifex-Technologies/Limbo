# Limbo (rust/): build, tests (the Go fixtures in testdata/parity included), lints, the daemon and CLI differential runs
# against the Go limbo of the pinned commit (rust/parity/go-limbo.sh), and a dependency audit. docs/RUST_PORT.md.
name: rust
on:
  push:
    paths: ["rust/**", "testdata/**", "packaging/**", "VERSION", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["rust/**", "testdata/**", "packaging/**", "VERSION", ".github/workflows/rust.yml"]
  schedule:
    - cron: "23 5 * * 1" # the audit weekly, for advisories published after the last change
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the pinned commit the Go limbo is built from
      # only to build the Go limbo of the pinned commit, the differential runs' referee
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: false
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - working-directory: rust
        run: cargo fmt --all --check
      - working-directory: rust
        run: cargo clippy --locked --all-targets -- -D warnings
      - working-directory: rust
        run: cargo test --locked
      - name: both daemons on the same socket traffic
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          # the real nft for the NFLOG packets (the runner has none), and the modules a user namespace cannot load
          sudo apt-get install -y --no-install-recommends nftables
          sudo modprobe -a nf_tables nfnetlink_log nft_log || true
          sudo mkdir -p /etc/limbo
          sh rust/parity/go-limbo.sh /tmp/limbo-go
          (cd rust && cargo build --locked --release --bins --example usbmon_fake)
          python3 -I rust/parity/daemon-differential.py --go /tmp/limbo-go --rs rust/target/release/limbo-rs --out /tmp/ld --idle 5
          # the NFLOG part ran: both daemons wrote flow events
          grep -q '"kind":"net.flow"' /tmp/ld/go/state/events.jsonl
      - name: both CLIs on the same scripted socket
        run: python3 -I rust/parity/cli-differential.py --go /tmp/limbo-go --rs rust/target/release/limbo-rs --out /tmp/lcd --require-all
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo install --locked cargo-audit
      - run: cargo audit --file rust/Cargo.lock --deny warnings
