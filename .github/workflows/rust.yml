# The Rust port of limbo serve and the socket-client commands (rust/): the Go fixtures current, build, tests (the
# fixtures included), lints, the daemon and CLI differential runs, and a dependency audit. docs/RUST_PORT.md.
name: rust
on:
  push:
    paths: ["rust/**", "internal/**", "testdata/**", "cmd/**", "VERSION", "*.go", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["rust/**", "internal/**", "testdata/**", "cmd/**", "VERSION", "*.go", ".github/workflows/rust.yml"]
  schedule:
    - cron: "23 5 * * 1" # the audit weekly, for advisories published after the last change
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: every Go file is gofmt-formatted
        run: |
          unformatted=$(gofmt -l .)
          [ -z "$unformatted" ] || { echo "run gofmt -w on:"; echo "$unformatted"; exit 1; }
      - name: the Go fixtures are current
        run: go test ./internal/... ./cmd/limbo -run Parity
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - working-directory: rust
        run: cargo fmt --all --check
      - working-directory: rust
        run: cargo clippy --locked --all-targets -- -D warnings
      - working-directory: rust
        run: cargo test --locked
      - name: both daemons on the same socket traffic
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          # the real nft for the NFLOG packets (the runner has none), and the modules a user namespace cannot load
          sudo apt-get install -y --no-install-recommends nftables
          sudo modprobe -a nf_tables nfnetlink_log nft_log || true
          sudo mkdir -p /etc/limbo
          CGO_ENABLED=0 go build -trimpath -o /tmp/limbo-go ./cmd/limbo
          (cd rust && cargo build --locked --release)
          python3 -I rust/parity/daemon-differential.py --go /tmp/limbo-go --rs rust/target/release/limbo-rs --out /tmp/ld --idle 5
          # the NFLOG part ran: both daemons wrote flow events
          grep -q '"kind":"net.flow"' /tmp/ld/go/state/events.jsonl
      - name: both CLIs on the same scripted socket
        run: python3 -I rust/parity/cli-differential.py --go /tmp/limbo-go --rs rust/target/release/limbo-rs --out /tmp/lcd
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo install --locked cargo-audit
      - run: cargo audit --file rust/Cargo.lock --deny warnings
