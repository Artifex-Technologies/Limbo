# Yggdrasil's game time (Yggdrasil docs/GAME_TIME.md): the weekly image check waits while a game runs and catches up
# within 5 minutes of the game ending. Game time is optional for Limbo (LykanOS has none), and systemd skips a unit
# whose ExecCondition= program is missing (status 203 counts as "condition failed", seen 2026-11-09), so the check is
# asked only when /usr/bin/yggdrasil-gametime is there; without it the chore runs. "+" runs the question outside the
# unit's sandbox, as game time's own drop-ins do ($$1 is systemd's escape for the shell's $1, the unit's name).
[Service]
ExecCondition=+/bin/sh -c '[ ! -x /usr/bin/yggdrasil-gametime ] || exec /usr/bin/yggdrasil-gametime no-game "$$1"' sh %n
